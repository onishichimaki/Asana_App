name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/taskcapture-web/package-lock.json
      - name: Restore .NET
        run: dotnet restore TaskCapture.sln
      - name: Build .NET
        run: dotnet build TaskCapture.sln --configuration Release --no-restore
      - name: Test .NET
        run: dotnet test TaskCapture.sln --configuration Release --no-build
      - name: Install web dependencies
        run: npm ci --prefix src/taskcapture-web
      - name: Lint web
        run: npm run lint --prefix src/taskcapture-web
      - name: Build web
        run: npm run build --prefix src/taskcapture-web
